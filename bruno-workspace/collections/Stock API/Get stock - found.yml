info:
  name: Get stock - found
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/v1/stock/RL171482'
  auth: none
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the part with warehouses and as_of", function() {
            const b = res.getBody();
            expect(b.part_number).to.equal("RL171482");
            expect(b.warehouses).to.have.all.keys("DAL", "PHX", "ATL");
            expect(b.as_of).to.be.a("string");
        });
settings:
  encodeUrl: true
  timeout: 0
docs: |-
  Single part lookup: part_number, warehouses {DAL, PHX, ATL}, as_of (when the reading was taken).
